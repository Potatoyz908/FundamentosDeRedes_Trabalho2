<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="sans-serif" font-size="14">
<rect width="760" height="250" fill="#ffffff"/>
<rect x="20" y="70" width="170" height="100" rx="8" fill="#e8f1fb" stroke="#2f6db5" stroke-width="2"/>
<text x="105" y="105" text-anchor="middle" font-weight="bold" fill="#1d3f6e">Rede de acesso</text>
<text x="105" y="128" text-anchor="middle" fill="#1d3f6e">192.168.X.0/24</text>
<text x="105" y="150" text-anchor="middle" fill="#1d3f6e">gateway 192.168.X.1</text>
<rect x="290" y="50" width="190" height="140" rx="8" fill="#fff4e0" stroke="#c77a00" stroke-width="2"/>
<text x="385" y="80" text-anchor="middle" font-weight="bold" fill="#6b4200">Raspberry Pi (FreeBSD)</text>
<text x="385" y="106" text-anchor="middle" fill="#6b4200">pf: NAT + rdr + filtro</text>
<text x="385" y="128" text-anchor="middle" fill="#6b4200">dnsmasq: DHCP</text>
<text x="385" y="150" text-anchor="middle" fill="#6b4200">ip forwarding = 1</text>
<text x="385" y="172" text-anchor="middle" fill="#6b4200">hostname roteador-fdr</text>
<rect x="580" y="70" width="160" height="100" rx="8" fill="#e9f7ec" stroke="#2e8b4a" stroke-width="2"/>
<text x="660" y="105" text-anchor="middle" font-weight="bold" fill="#1d5a30">Host de testes</text>
<text x="660" y="128" text-anchor="middle" fill="#1d5a30">172.16.0.10 (DHCP fixo)</text>
<text x="660" y="150" text-anchor="middle" fill="#1d5a30">nc -lk 8080</text>
<line x1="190" y1="120" x2="290" y2="120" stroke="#333" stroke-width="2"/>
<line x1="480" y1="120" x2="580" y2="120" stroke="#333" stroke-width="2"/>
<text x="240" y="110" text-anchor="middle" fill="#333">ue0 (WAN)</text>
<text x="530" y="110" text-anchor="middle" fill="#333">ue1 (LAN)</text>
<text x="240" y="142" text-anchor="middle" fill="#555" font-size="12">DHCP / IP fixo</text>
<text x="530" y="142" text-anchor="middle" fill="#555" font-size="12">172.16.0.1/16</text>
<text x="385" y="225" text-anchor="middle" fill="#555" font-size="12">Interfaces: ue0 = nativa da Pi; ue1 = adaptador USB-Ethernet</text>
</svg>
