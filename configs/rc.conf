# Configuracao de Inicializacao do Sistema FreeBSD (/etc/rc.conf)
# Disciplina: Fundamentos de Redes - Trabalho 02 (Roteador Raspberry Pi)

# 1. Identificacao do Host
hostname="roteador-fdr"

# 2. Configuracao das Interfaces de Rede
# Interface Externa (WAN - ue0): obtencao dinamica de IP na rede de acesso via DHCP
ifconfig_ue0="DHCP"

# Interface Interna (LAN - ue1): endereco estatico do gateway da rede privada 172.16.0.0/16
ifconfig_ue1="inet 172.16.0.1 netmask 255.255.0.0"

# Parametros alternativos para laboratorio com IP estatico na WAN:
# ifconfig_ue0="inet 192.168.X.Y netmask 255.255.255.0"
# defaultrouter="192.168.X.1"

# 3. Repasse de Pacotes (Roteamento IPv4)
# Ativa sysctl net.inet.ip.forwarding=1 para habilitar o encaminhamento entre interfaces
gateway_enable="YES"

# 4. Firewall e Traducao de Enderecos (Packet Filter)
pf_enable="YES"
pf_rules="/etc/pf.conf"
pflog_enable="YES"
pflog_logfile="/var/log/pflog"

# 5. Servicos de Rede e Administracao
# Servidor DHCP local para estacoes conectadas a interface LAN
dnsmasq_enable="YES"

# Servico de terminal seguro (SSH) para administracao e coleta de metricas
sshd_enable="YES"

# 6. Otimizacoes e Recursos da Plataforma (Raspberry Pi)
# Sincronizacao de relogio via NTP na inicializacao (hardware sem bateria RTC)
ntpd_enable="YES"
ntpd_sync_on_start="YES"

# Expansao automatica do sistema de arquivos para cobrir a capacidade total do microSD
growfs_enable="YES"

# Controle de consumo e ajuste dinamico de frequencia do processador
powerd_enable="YES"

# Desativa servico de correio local e despejos de memoria para preservar o cartao SD
sendmail_enable="NONE"
dumpdev="NO"
