# /etc/rc.conf - roteador do Trabalho 02
# Validar: sh -n /etc/rc.conf     Aplicar: shutdown -r now
# ATENCAO: na Pi, conferir com o /etc/rc.conf original (cat /etc/rc.conf.orig)
# e manter as linhas do sistema. Remover ifconfig_DEFAULT="DHCP", se existir.

hostname="roteador"

# --- Interfaces ---
# WAN: recebe IP da rede de acesso por DHCP
ifconfig_ue0="DHCP"
# LAN: nossa rede privada; o roteador e o 172.16.0.1, mascara /16
ifconfig_ue1="inet 172.16.0.1 netmask 255.255.0.0"

# Laboratorio com IP fixo (comente a linha ifconfig_ue0 acima e use estas):
# ifconfig_ue0="inet 192.168.X.Y netmask 255.255.255.0"
# defaultrouter="192.168.X.1"

# --- Repasse de pacotes entre as interfaces ---
gateway_enable="YES"

# --- Servicos ---
sshd_enable="YES"
dnsmasq_enable="YES"
pf_enable="YES"
pf_rules="/etc/pf.conf"
pflog_enable="YES"

# --- Padroes da imagem da Pi (conferir com o rc.conf original) ---
ntpd_enable="YES"
ntpd_sync_on_start="YES"
growfs_enable="YES"
powerd_enable="YES"
