# /etc/pf.conf - NAT, DNAT e firewall do Trabalho 02
# Validar: pfctl -nf /etc/pf.conf     Aplicar: pfctl -f /etc/pf.conf

# --- Macros (variaveis) ---
ext_if      = "ue0"
int_if      = "ue1"
lan_net     = "172.16.0.0/16"
host_teste  = "172.16.0.10"

# --- Opcoes ---
set skip on lo0

# --- Traducao (vem ANTES dos filtros) ---
# NAT: quem sai da LAN usa o IP atual da WAN
nat on $ext_if inet from $lan_net to any -> ($ext_if)
# DNAT: porta 80 da WAN vai para a porta 8080 da maquina de testes
rdr on $ext_if inet proto tcp from any to ($ext_if) port 80 tag DNAT -> $host_teste port 8080

# --- Filtros (a ULTIMA regra que casa vence, exceto as marcadas quick) ---

# REQUISITO: impede pings (echo request) da LAN para fora da LAN
block in quick log on $int_if inet proto icmp from $lan_net to ! $lan_net icmp-type echoreq

# LAN: o resto passa
pass in  on $int_if all
pass out on $int_if all

# WAN: bloqueia tudo que entra e libera so o necessario
block in on $ext_if all
pass in on $ext_if inet proto udp from any port 67 to any port 68
pass in on $ext_if inet proto tcp from any to ($ext_if) port 22
pass in on $ext_if inet proto icmp from any to ($ext_if) icmp-type echoreq
# So entra na LAN o que foi marcado pelo rdr (DNAT)
pass in on $ext_if inet proto tcp tagged DNAT

# Saida pela WAN liberada; as respostas voltam pelo estado da conexao
pass out on $ext_if all
