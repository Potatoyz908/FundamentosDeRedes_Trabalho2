# Regras de Firewall e Roteamento - Packet Filter (PF)
# Disciplina: Fundamentos de Redes - Trabalho 02 (FreeBSD)

# 1. Identificadores e Macros
wan_if        = "ue0"
lan_if        = "ue1"

rede_lan      = "172.16.0.0/16"
host_alvo     = "172.16.10.111"
porta_dnat    = "80"
porta_servico = "8080"

# 2. Parametros Globais e Normalizacao
# Ignora inspecao na interface de loopback
set skip on lo0

# Politica de descarte silencioso na WAN (drop sem envio de resposta RST/ICMP)
set block-policy drop

# Coleta metricas e estatisticas de trafego na interface externa
set loginterface $wan_if

# Saneia e desfragmenta pacotes TCP/IP na entrada
scrub in all

# 3. Traducao de Enderecos (NAT & DNAT / Port Forwarding)
# NAT: Mascaramento dinamico para os hosts da LAN acessarem a rede externa
nat on $wan_if inet from $rede_lan to any -> ($wan_if)

# DNAT: Encaminha requisicoes recebidas na porta 80 da WAN para o host de testes na porta 8080
rdr on $wan_if inet proto tcp from any to ($wan_if) port $porta_dnat tag DNAT_TESTE -> $host_alvo port $porta_servico

# 4. Regras de Filtragem

# REQUISITO ENUNCIADO: Bloqueia ping (ICMP Echo Request) da LAN direcionado para fora da LAN
block in quick log on $lan_if inet proto icmp from $rede_lan to ! $rede_lan icmp-type echoreq

# Segmento LAN: permite trafego de entrada e saida com controle de estado
pass in  on $lan_if all keep state
pass out on $lan_if all keep state

# Segmento WAN: politica padrao restritiva de entrada
block in on $wan_if all

# Excecoes explicitas para conexoes de entrada na interface WAN:
# - Concessao DHCP recebida do roteador de acesso (servidor 67 -> cliente 68)
pass in on $wan_if inet proto udp from any port 67 to any port 68
# - Acesso administrativo remoto via SSH ao roteador
pass in on $wan_if inet proto tcp to ($wan_if) port 22 keep state
# - Diagnostico ICMP direcionado especificamente ao roteador
pass in on $wan_if inet proto icmp to ($wan_if) icmp-type echoreq keep state
# - Pacotes autenticados e redirecionados pela regra de DNAT
pass in on $wan_if inet proto tcp tagged DNAT_TESTE keep state

# Saida livre na interface WAN com manutencao de tabela de estados
pass out on $wan_if all keep state
