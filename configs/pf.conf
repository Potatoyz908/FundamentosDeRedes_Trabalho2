# Regras de Firewall e Roteamento Packet Filter (PF)
# Disciplina: Fundamentos de Redes - Trabalho 02 (FreeBSD)


# 1. Identificadores e Macros
wan_if          = "ue0"
lan_if          = "ue1"

rede_privada    = "172.16.0.0/16"
ip_alvo_dnat    = "172.16.0.10"
porta_servico   = "8080"
porta_publica   = "80"

portas_wan_dhcp = "{ 67, 68 }"
servicos_wan_in = "{ 22 }"

# 2. Parametros Globais e Normalizacao
# Ignora inspecao na interface de loopback
set skip on lo0

# Politica de descarte silencioso (impede vazamento de informacoes na WAN)
set block-policy drop

# Habilita coleta de metricas e estatisticas na interface externa
set loginterface $wan_if

# Remonta fragmentos e saneia pacotes TCP/IP antes de inspecionar
scrub in on $wan_if all fragment reassemble

# 3. Traducao de Enderecos (NAT & Port Forwarding / DNAT)
# NAT: Mascaramento dinamico do trafego de saida da LAN para a WAN
nat on $wan_if inet from $rede_privada to any -> ($wan_if)

# DNAT: Redireciona requisicoes TCP na porta 80 da WAN para o host interno na 8080
rdr on $wan_if inet proto tcp from any to ($wan_if) port $porta_publica \
    tag FW_DNAT_HTTP -> $ip_alvo_dnat port $porta_servico

# 4. Regras de Filtragem
# REQUISITO ENUNCIADO: Intercepta e bloqueia pings (ICMP Echo Request)
# originados na LAN com destino fora do segmento 172.16.0.0/16
block in quick log on $lan_if inet proto icmp \
    from $rede_privada to ! $rede_privada icmp-type echoreq

# Segmento interno (LAN): permite fluxo livre de entrada e saida com estado
pass in  on $lan_if all keep state
pass out on $lan_if all keep state

# Segmento externo (WAN): politica restritiva de entrada
block in on $wan_if all

# Excecoes de entrada na WAN:
# - Negociacao de concessao DHCP do provedor/rede de acesso
pass in on $wan_if inet proto udp from any port $portas_wan_dhcp to any port $portas_wan_dhcp
# - Acesso administrativo remoto (SSH)
pass in on $wan_if inet proto tcp to ($wan_if) port $servicos_wan_in keep state
# - Diagnostico ICMP direcionado exclusivamente ao roteador
pass in on $wan_if inet proto icmp to ($wan_if) icmp-type echoreq keep state
# - Permite entrada de conexoes roteadas e marcadas pela diretiva de DNAT
pass in on $wan_if inet proto tcp tagged FW_DNAT_HTTP keep state

# Saida liberada na WAN com manutencao de tabela de conexoes
pass out on $wan_if all keep state