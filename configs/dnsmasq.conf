# Configuracao do Servidor DHCP (dnsmasq) - /usr/local/etc/dnsmasq.conf
# Disciplina: Fundamentos de Redes - Trabalho 02 (Segmento LAN 172.16.0.0/16)

# 1. Modo de Operacao e Isolamento de Servico
# Desativa a escuta na porta 53 (DNS); o daemon atua exclusivamente como servidor DHCP
port=0
no-resolv
no-poll

# Vincula o servico exclusivamente a interface de rede local interna
interface=ue1
bind-interfaces

# Servidor autoritativo: responde imediatamente a solicitacoes de clientes na LAN
dhcp-authoritative

# 2. Distribuicao Dinamica de Enderecos e Opcoes de Rede (RFC 2132)
# Faixa dinamica de atribuicao de IPs (/16) com tempo de concessao (lease) de 12 horas
dhcp-range=172.16.1.1,172.16.1.254,255.255.0.0,12h

# Opcao 1 (Subnet Mask): Mascara da sub-rede privada
dhcp-option=option:netmask,255.255.0.0

# Opcao 3 (Router): Gateway padrao entregue aos clientes (IP do roteador na LAN)
dhcp-option=option:router,172.16.0.1

# Opcao 6 (Domain Name Server): Servidores DNS institucionais
dhcp-option=option:dns-server,164.41.101.4,164.41.101.11

# 3. Reserva Estatica de Enderecamento (Host de Avaliacao / Alvo do DNAT)
# Vinculacao deterministica do IP fixo 172.16.10.110 para o host de testes da avaliacao.
# Substituir o endereco MAC de exemplo pelo MAC real do dispositivo conectado.
dhcp-host=0c:cc:47:ec:09:6b,host-avaliacao,172.16.10.110,infinite

# 4. Persistencia de Concessoes e Auditoria
# Arquivo de estado para acompanhamento das concessoes ativas
dhcp-leasefile=/var/db/dnsmasq.leases

# Registro detalhado das transacoes do ciclo DORA (Discover, Offer, Request, Ack)
log-dhcp
log-facility=/var/log/dnsmasq.log
