# /usr/local/etc/dnsmasq.conf - DHCP da LAN do Trabalho 02
# Validar: dnsmasq --test     Aplicar: service dnsmasq restart

# So DHCP: port=0 desliga a parte de DNS do dnsmasq
port=0
# Atende somente a interface da LAN
interface=ue1
# Este e o unico servidor DHCP desta rede
dhcp-authoritative

# Faixa de IPs distribuidos, mascara /16, validade de 12 horas
dhcp-range=172.16.1.1,172.16.1.254,255.255.0.0,12h

# O gateway que os clientes recebem (a Pi)
dhcp-option=option:router,172.16.0.1

# DNS que os clientes recebem (deixe so UMA destas linhas ativa)
dhcp-option=option:dns-server,164.41.101.4,164.41.101.11
# dhcp-option=option:dns-server,192.168.X.1

# IP fixo da maquina de testes: sempre 172.16.0.10 para este MAC.
# Troque o MAC de exemplo pelo MAC real (ver /var/db/dnsmasq.leases).
dhcp-host=00:00:00:00:00:01,maquina-teste,172.16.0.10
# Varios notebooks possiveis (so um ligado de cada vez):
# dhcp-host=MAC1,MAC2,maquina-teste,172.16.0.10

# Registro das concessoes (leases) e do DHCP
dhcp-leasefile=/var/db/dnsmasq.leases
log-dhcp
log-facility=/var/log/dnsmasq.log
